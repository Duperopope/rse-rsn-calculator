name: Refresh dependency locks

on:
  push:
    branches:
      - deps/security-refresh-2026-10-03
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deps-security-refresh-locks
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh client lockfile
        run: npm --prefix client install --package-lock-only --ignore-scripts

      - name: Show audits
        run: |
          npm audit --audit-level=low || true
          npm --prefix client audit --audit-level=low || true

      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- package-lock.json client/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json client/package-lock.json
          git commit -m "chore: refresh dependency lockfiles"
          git push origin HEAD:deps/security-refresh-2026-10-03
