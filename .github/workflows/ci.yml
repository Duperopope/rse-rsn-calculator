name: CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Runtime dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --json || true

      - name: Frontend dependency audit
        continue-on-error: true
        working-directory: client
        run: npm audit --omit=dev --json || true

      - name: Syntax check
        run: npm run pretest

      - name: Static quality gate
        run: npm run quality

      - name: Backend, regulatory and PDF tests
        run: npm test

      - name: Frontend production build
        working-directory: client
        run: npm run build

      - name: Browser user journey
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e
