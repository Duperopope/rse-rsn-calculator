name: FIMO Check CI

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Release invariants
        run: npm run qa:release

      - name: Syntax
        run: npm run check:syntax

      - name: Regulatory and integration tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Product E2E
        run: npm run test:e2e

      - name: Critical dependency audit
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix client audit --omit=dev --audit-level=critical
