name: FIMO Check CI

concurrency:
  group: fimo-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Preview dependency lock remediation
        run: |
          npm audit fix --package-lock-only --omit=dev --ignore-scripts || true
          echo "=== PACKAGE_LOCK_AUDIT_FIX_DIFF ==="
          git diff -- package-lock.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh production dependency lock"
            git push origin HEAD:audit/pro-hardening-2026-10-02
          fi
          npm ci

      - name: Release invariants
        run: npm run qa:release

      - name: Syntax
        run: npm run check:syntax

      - name: Regulatory and integration tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Critical dependency audit
        run: |
          npm audit --omit=dev --audit-level=critical
          npm --prefix client audit --omit=dev --audit-level=critical

      - name: Product E2E
        run: npm run test:e2e
