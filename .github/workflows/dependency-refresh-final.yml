name: Refresh dependency locks final

on:
  push:
    branches:
      - deps/security-refresh-final-2026-10-03
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Refresh lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          npm --prefix client install --package-lock-only --ignore-scripts

      - name: Audit everything
        run: |
          npm audit --audit-level=low
          npm --prefix client audit --audit-level=low

      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- package-lock.json client/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json client/package-lock.json
          git commit -m "chore: refresh secure dependency lockfiles"
          git push origin HEAD:deps/security-refresh-final-2026-10-03
