services:
  - type: web
    name: rse-rsn-calculator
    runtime: node
    plan: free
    repo: https://github.com/Duperopope/rse-rsn-calculator
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --omit=dev && npm --prefix client ci --include=dev && npm --prefix client run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
